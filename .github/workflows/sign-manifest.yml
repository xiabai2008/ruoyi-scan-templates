name: sign-manifest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 cryptography
        run: pip install cryptography

      - name: 从 Secret 注入签名私钥（用后即删）
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          printf '%s' "$SIGNING_KEY" > signing.key
          chmod 600 signing.key

      - name: 生成签名 manifest
        run: python scripts/sign_manifest.py --out-dir . --key-path signing.key

      - name: 提交签名 manifest（无变化则跳过）
        run: |
          rm -f signing.key
          if git diff --quiet manifest.json; then
            echo "manifest 无变化，跳过提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "chore(manifest): 重新生成签名 manifest"
            git push
          fi